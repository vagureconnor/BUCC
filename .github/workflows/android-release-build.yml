name: Android Release APK

on:
  push:
    branches: [codex/latest-payment-fixes-20261024]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-release:
    name: Build signed Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform and build tools
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Validate and install release keystore
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_KEY)) {
            throw 'Missing repository secret SIGNING_KEY (base64-encoded upload keystore).'
          }
          $bytes = [Convert]::FromBase64String($env:SIGNING_KEY)
          [IO.File]::WriteAllBytes("$env:GITHUB_WORKSPACE/androidApp/release.jks", $bytes)
      - name: Build release APK
        env:
          SIGNING_KEY: release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          test -n "$SIGNING_KEY_PASSWORD"
          ./gradlew :androidApp:assembleRelease --no-configuration-cache
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs androidApp/build/outputs/apk/release/androidApp-release.apk
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: BUCC-Android-Release-${{ github.sha }}
          path: androidApp/build/outputs/apk/release/androidApp-release.apk
          if-no-files-found: error
          retention-days: 14
