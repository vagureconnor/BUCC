name: Verify Local Five Platform Gate

on:
  workflow_dispatch:

permissions:
  statuses: read

jobs:
  verify-local-gate:
    name: Verify existing local gate status
    runs-on: ubuntu-latest
    steps:
      - name: Verify the current commit SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          state="$(gh api "repos/$REPOSITORY/commits/$SOURCE_SHA/status" --jq '.statuses | map(select(.context == "Local five platform gate")) | first | .state // "missing"')"
          if [ "$state" != success ]; then
            echo "::error::No successful Local five platform gate status exists for $SOURCE_SHA."
            exit 1
          fi
          echo "Local five platform gate already succeeded for $SOURCE_SHA."
          echo "This workflow does not build, sign, or publish a release."
