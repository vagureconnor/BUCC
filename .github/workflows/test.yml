name: Test Compilation

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:
    inputs:
      ios_only:
        description: 仅验证完整 iOS App 的未签名归档
        type: boolean
        default: false

jobs:
  test-android:
    name: Test Android
    if: github.event_name != 'workflow_dispatch' || !inputs.ios_only
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile Android
        run: ./gradlew :androidApp:assembleDebug

  test-desktop-linux:
    name: Test Desktop Linux
    if: github.event_name != 'workflow_dispatch' || !inputs.ios_only
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile Desktop
        run: |
          ./gradlew :shared:compileKotlinMetadata
          ./gradlew :composeApp:compileKotlinJvm

  test-ios:
    name: Test iOS
    runs-on: macos-15
    timeout-minutes: 75
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: 校验 iOS 发布元数据与签名规则
        run: python3 -m unittest discover -s .github/scripts -p 'test_ios_release.py'
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: 验证完整 iOS App 归档
        run: |
          xcodebuild -version
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/BUCC-unsigned.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/bucc-ios-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=

  test-windows:
    name: Test Windows
    if: github.event_name != 'workflow_dispatch' || !inputs.ios_only
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile Windows
        run: ./gradlew :composeApp:compileKotlinJvm
