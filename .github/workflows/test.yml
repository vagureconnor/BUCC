name: Five Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: five-platform-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  version-contract:
    name: Version and release contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 .github/scripts/version_sync.py --check
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

  android:
    name: Android Release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :androidApp:assembleRelease -Pbucc.android.unsignedRelease=true --no-configuration-cache

  ios:
    name: iOS unsigned device archive
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Archive for physical iOS devices without signing
        run: |
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/BUCC-unsigned.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/bucc-ios-derived-data" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=
      - name: Package unsigned IPA
        run: |
          mkdir -p build/ios-release
          app="$RUNNER_TEMP/BUCC-unsigned.xcarchive/Products/Applications/iosApp.app"
          python3 script/package_unsigned_ipa.py "$app" build/ios-release/BUCC-iOS-v2.0.1-unsigned.ipa

  macos:
    name: macOS Release (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      BUCC_TD_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :composeApp:packageReleaseDmg
      - name: Run shared and Compose business tests
        if: matrix.arch == 'arm64'
        run: ./gradlew :shared:jvmTest :composeApp:jvmTest --no-configuration-cache

  windows:
    name: Windows x64 Release build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - uses: gradle/actions/setup-gradle@v4
      - name: Package Windows Release
        shell: pwsh
        run: |
          $env:BUCC_BASH = 'C:\Program Files\Git\bin\bash.exe'
          $env:BUCC_GO = & 'C:\Program Files\Git\usr\bin\cygpath.exe' -u (Get-Command go).Source
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          .\gradlew.bat :composeApp:packageReleaseExe --no-configuration-cache

  harmony:
    name: HarmonyOS Release build (blocked until official CLI toolchain pin is available)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Require pinned official Harmony toolchain
        run: |
          echo '::error::Harmony CI blocked: Huawei Command Line Tools 26.0.0.821 download requires authenticated download-center authInfo/csrf cookies; no fixed public URL/hash is available. The local IDE profile is 26.0.0.851/SDK 26.0.0.105/Hvigor 6.26.8/OHPM 26.0.0.630 and is not being substituted for the CLI profile.'
          exit 1

  platform-gate:
    name: Five platform gate
    if: always()
    needs: [version-contract, android, ios, macos, windows, harmony]
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform and contract job to succeed
        env:
          VERSION: ${{ needs.version-contract.result }}
          ANDROID: ${{ needs.android.result }}
          IOS: ${{ needs.ios.result }}
          MACOS: ${{ needs.macos.result }}
          WINDOWS: ${{ needs.windows.result }}
          HARMONY: ${{ needs.harmony.result }}
        run: |
          for result in "$VERSION" "$ANDROID" "$IOS" "$MACOS" "$WINDOWS" "$HARMONY"; do
            if [ "$result" != success ]; then
              echo "::error::Five-platform gate failed: required job result was $result (only success is accepted)."
              exit 1
            fi
          done
