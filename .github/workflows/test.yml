name: Source contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    name: Source contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check release version metadata
        run: python3 .github/scripts/version_sync.py --check
      - name: Run Python source contract suite
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
