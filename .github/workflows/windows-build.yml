name: Windows x64 Candidate Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-candidate:
    name: Build Windows x64 candidate
    runs-on: windows-latest
    steps:
      - name: Check out dispatched source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify source SHA and release metadata
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python .github/scripts/version_sync.py --check
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: Set up Python x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build Windows x64 installer
        shell: pwsh
        run: |
          $env:BUCC_BASH = 'C:\Program Files\Git\bin\bash.exe'
          $env:BUCC_GO = & 'C:\Program Files\Git\usr\bin\cygpath.exe' -u (Get-Command go).Source
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          .\gradlew.bat :composeApp:packageReleaseExe --no-configuration-cache
      - name: Prepare SHA-bound candidate metadata
        shell: pwsh
        run: |
          $version = (Select-String -Path gradle.properties -Pattern '^project.version=').Line.Split('=')[1]
          $sourceSha = $env:GITHUB_SHA
          $output = 'composeApp/build/compose/binaries/main-release/exe'
          $files = @(Get-ChildItem "$output/BUCC-*.exe")
          if ($files.Count -ne 1) { throw "Expected one Windows installer, found $($files.Count)." }
          New-Item -ItemType Directory -Force candidate | Out-Null
          $installer = "candidate/BUCC-Windows-v$version.exe"
          Copy-Item $files[0].FullName $installer
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $metadata = @{
            platform = 'windows'
            version = $version
            source_sha = $sourceSha
            arch = 'x86_64'
            file = [IO.Path]::GetFileName($installer)
            sha256 = $hash
          }
          $metadata | ConvertTo-Json -Depth 4 | Set-Content candidate/metadata.json -Encoding utf8
      - name: Upload Windows installer candidate
        uses: actions/upload-artifact@v4
        with:
          name: BUCC-Windows-Candidate-${{ github.sha }}
          path: candidate/*
          if-no-files-found: error
          retention-days: 14
