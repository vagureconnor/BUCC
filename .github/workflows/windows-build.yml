name: Windows Build

on:
  push:
    branches: [codex/latest-payment-fixes-20261024]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: Set up Python x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build Windows installer
        shell: pwsh
        run: |
          $env:BUCC_BASH = 'C:\Program Files\Git\bin\bash.exe'
          $env:BUCC_GO = & 'C:\Program Files\Git\usr\bin\cygpath.exe' -u (Get-Command go).Source
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          .\gradlew.bat :composeApp:packageReleaseExe --no-configuration-cache
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: BUCC-Windows-${{ github.sha }}
          path: composeApp/build/compose/binaries/main-release/exe/BUCC-*.exe
          if-no-files-found: error
          retention-days: 14
